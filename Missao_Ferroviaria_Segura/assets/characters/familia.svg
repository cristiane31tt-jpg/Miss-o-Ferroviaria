    <pattern id="tactF" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4" fill="#ffe9a3" opacity="0.9"/>
      <circle cx="19" cy="19" r="4" fill="#ffe9a3" opacity="0.9"/>
    </pattern>
    <filter id="shF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="url(#bgF)"/>
