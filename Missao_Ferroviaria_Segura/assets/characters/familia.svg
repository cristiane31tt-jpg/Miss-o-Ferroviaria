      <stop offset="1" stop-color="#efb72c"/>
    </linearGradient>
    <linearGradient id="skinDf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5a38"/>
      <stop offset="1" stop-color="#744526"/>
