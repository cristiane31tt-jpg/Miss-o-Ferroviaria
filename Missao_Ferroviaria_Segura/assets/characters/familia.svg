      <stop offset="0" stop-color="#e7f3fd"/>
      <stop offset="1" stop-color="#d5e6f4"/>
    </linearGradient>
    <linearGradient id="floorF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#cfd9e3"/>
