<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Cena na plataforma: o pai parado atrás da faixa amarela, uma menina correndo, um menino sentado no chão e um passageiro pulando no banco">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceefb"/>
      <stop offset="1" stop-color="#f6ebd7"/>
    </linearGradient>
    <linearGradient id="floorE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#ced8e2"/>
    </linearGradient>
    <linearGradient id="yelE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd70"/>
      <stop offset="1" stop-color="#efb72c"/>
    </linearGradient>
    <linearGradient id="skinDe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5a38"/>
      <stop offset="1" stop-color="#744526"/>
    </linearGradient>
    <pattern id="tactE" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.6" fill="#ffe9a3" opacity="0.9"/>
      <circle cx="17" cy="17" r="3.6" fill="#ffe9a3" opacity="0.9"/>
    </pattern>
    <filter id="shE" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgE)"/>
  <!-- cobertura -->
  <rect width="800" height="54" fill="#7ba2c9"/>
  <rect y="48" width="800" height="12" fill="#5c86b1"/>
  <rect x="40" y="54" width="20" height="240" rx="8" fill="#8fb6d9"/>
  <rect x="740" y="54" width="20" height="240" rx="8" fill="#8fb6d9"/>
  <!-- placa -->
  <line x1="400" y1="54" x2="400" y2="76" stroke="#54789e" stroke-width="4"/>
  <rect x="316" y="76" width="168" height="38" rx="10" fill="#2f6cb5"/>
  <text x="400" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Plataforma 2</text>
  <!-- relógio -->
  <circle cx="120" cy="96" r="26" fill="#ffffff" stroke="#54789e" stroke-width="6"/>
  <line x1="120" y1="96" x2="120" y2="80" stroke="#243b53" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="96" x2="133" y2="103" stroke="#243b53" stroke-width="4" stroke-linecap="round"/>

  <!-- piso e borda -->
  <rect y="160" width="800" height="340" fill="url(#floorE)"/>
  <rect y="160" width="800" height="16" fill="#f7fafd"/>
  <rect y="160" width="800" height="6" fill="#c3ced9"/>
  <g stroke="#dde5ed" stroke-width="3">
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- faixa amarela -->
  <rect y="196" width="800" height="42" fill="url(#yelE)"/>
  <rect y="196" width="800" height="42" fill="url(#tactE)"/>
  <rect y="196" width="800" height="5" fill="#fff0bd" opacity="0.9"/>
  <rect y="233" width="800" height="5" fill="#d99f1f" opacity="0.85"/>

  <!-- ============ PAI — atitude segura (atrás da faixa, parado e atento) ============ -->
  <g transform="translate(140,300) scale(0.98)">
    <ellipse cx="0" cy="176" rx="52" ry="11" fill="#5f748a" opacity="0.3" filter="url(#shE)"/>
    <path d="M -16 108 L -19 166" stroke="#3d4c5e" stroke-width="23" stroke-linecap="round"/>
    <path d="M 16 108 L 19 166" stroke="#3d4c5e" stroke-width="23" stroke-linecap="round"/>
    <ellipse cx="-23" cy="174" rx="18" ry="9" fill="#37414d"/>
    <ellipse cx="23" cy="174" rx="18" ry="9" fill="#37414d"/>
    <path d="M -32 56 Q -46 84 -42 114" stroke="#4fa3a5" stroke-width="19" stroke-linecap="round" fill="none"/>
    <circle cx="-42" cy="118" r="9.5" fill="url(#skinDe)"/>
    <path d="M 32 56 Q 46 84 42 114" stroke="#4fa3a5" stroke-width="19" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="118" r="9.5" fill="url(#skinDe)"/>
    <path d="M -36 110 L -36 56 Q -36 37 -19 32 L 0 44 L 19 32 Q 36 37 36 56 L 36 110 Z" fill="#4fa3a5"/>
    <path d="M -11 34 L 0 45 L 11 34 L 7 58 L -7 58 Z" fill="#e8f4f4"/>
    <rect x="-9" y="20" width="18" height="18" rx="7" fill="#6d4226"/>
    <g>
      <circle cx="-26" cy="3" r="6.5" fill="#744526"/>
      <circle cx="26" cy="3" r="6.5" fill="#744526"/>
      <ellipse cx="0" cy="0" rx="27.5" ry="29.5" fill="url(#skinDe)"/>
      <ellipse cx="-9.5" cy="-1" rx="7.2" ry="8.2" fill="#ffffff"/>
      <ellipse cx="9.5" cy="-1" rx="7.2" ry="8.2" fill="#ffffff"/>
      <circle cx="-9" cy="0" r="4.5" fill="#2e2119"/>
      <circle cx="10" cy="0" r="4.5" fill="#2e2119"/>
      <circle cx="-10.6" cy="-2" r="1.7" fill="#ffffff"/>
      <circle cx="8.4" cy="-2" r="1.7" fill="#ffffff"/>
      <path d="M -16 -12 Q -10 -16 -4 -13" stroke="#241a14" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M 4 -13 Q 10 -16 16 -12" stroke="#241a14" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M -9 17 Q 0 26 9 17 Q 0 21 -9 17 Z" fill="#4b2f24"/>
      <path d="M -7 18 Q 0 21.5 7 18 Q 0 20 -7 18 Z" fill="#ffffff"/>
      <path d="M -27 -2 C -30 -30 -12 -38 0 -38 C 14 -38 30 -30 27 -2 C 22 -18 11 -22 0 -22 C -12 -22 -22 -18 -27 -2 Z" fill="#241a14"/>
    </g>
    <!-- olhar atento para a placa -->
    <g fill="#2e2119" opacity="0.55">
      <circle cx="-6" cy="-1" r="2"/>
      <circle cx="13" cy="-1" r="2"/>
    </g>
  </g>

  <!-- ============ MENINA CORRENDO (área segura, mas comportamento errado) ============ -->
  <g transform="translate(345,318) scale(0.92)">
    <ellipse cx="0" cy="168" rx="50" ry="10" fill="#5f748a" opacity="0.28" filter="url(#shE)"/>
    <!-- linhas de movimento -->
    <g stroke="#9db9d2" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="-78" y1="60" x2="-116" y2="60"/>
      <line x1="-86" y1="92" x2="-128" y2="92"/>
      <line x1="-74" y1="124" x2="-112" y2="124"/>
    </g>
    <!-- pernas em passada -->
    <path d="M -6 100 L -36 152" stroke="#46617f" stroke-width="19" stroke-linecap="round"/>
    <path d="M 14 100 L 44 138" stroke="#46617f" stroke-width="19" stroke-linecap="round"/>
    <ellipse cx="-42" cy="158" rx="15" ry="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
    <ellipse cx="50" cy="143" rx="15" ry="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
    <!-- braços -->
    <path d="M -26 52 Q -50 62 -58 42" stroke="#f4a6c0" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="-60" cy="38" r="8" fill="#fbd9b7"/>
    <path d="M 26 52 Q 48 66 56 90" stroke="#f4a6c0" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="94" r="8" fill="#fbd9b7"/>
    <!-- corpo -->
    <path d="M -28 100 L -26 48 Q -26 30 -12 26 L 0 36 L 14 26 Q 28 30 28 48 L 30 100 Z" fill="#f4a6c0" transform="rotate(-6 0 60)"/>
    <rect x="-8" y="16" width="16" height="16" rx="7" fill="#eeba90"/>
    <!-- cabeça (cabelo solto correndo) -->
    <g transform="rotate(-6 0 0)">
      <path d="M -24 -4 C -34 6 -38 24 -34 36 L -16 24 Z" fill="#6b4a33"/>
      <path d="M 24 -4 C 34 4 40 20 38 34 L 20 24 Z" fill="#6b4a33"/>
      <ellipse cx="0" cy="0" rx="25" ry="27" fill="#fbd9b7"/>
      <ellipse cx="-8.5" cy="-1" rx="6.6" ry="7.6" fill="#ffffff"/>
      <ellipse cx="8.5" cy="-1" rx="6.6" ry="7.6" fill="#ffffff"/>
      <circle cx="-8" cy="0" r="4.2" fill="#4a3728"/>
      <circle cx="9" cy="0" r="4.2" fill="#4a3728"/>
      <circle cx="-9.5" cy="-1.8" r="1.6" fill="#ffffff"/>
      <circle cx="7.5" cy="-1.8" r="1.6" fill="#ffffff"/>
      <path d="M -14 -11 Q -9 -14.5 -4 -12" stroke="#6b4a33" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M 4 -12 Q 9 -14.5 14 -11" stroke="#6b4a33" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M -7 13 Q 0 20 7 13 Q 0 16.5 -7 13 Z" fill="#7d3f3a"/>
      <path d="M -24 -6 C -28 -30 -10 -38 2 -36 C 16 -36 28 -28 25 -6 C 18 -20 8 -22 -2 -20 C -12 -18 -19 -14 -24 -6 Z" fill="#6b4a33"/>
    </g>
  </g>

  <!-- ============ MENINO SENTADO NO MEIO DA PASSAGEM ============ -->
  <g transform="translate(505,352)">
    <ellipse cx="4" cy="106" rx="66" ry="12" fill="#5f748a" opacity="0.28" filter="url(#shE)"/>
    <!-- pernas estendidas -->
    <path d="M 6 78 L 74 92" stroke="#46617f" stroke-width="19" stroke-linecap="round"/>
    <path d="M 4 92 L 70 104" stroke="#3a5576" stroke-width="19" stroke-linecap="round"/>
    <ellipse cx="82" cy="94" rx="14" ry="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
    <ellipse cx="78" cy="107" rx="14" ry="8" fill="#ffffff" stroke="#4a90d9" stroke-width="3"/>
    <!-- corpo -->
    <path d="M -24 82 L -24 30 Q -24 14 -10 10 L 0 18 L 12 10 Q 26 14 26 30 L 26 82 Z" fill="#43b97f"/>
    <!-- braços de apoio -->
    <path d="M -22 44 Q -34 66 -32 84" stroke="#43b97f" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="-32" cy="87" r="7.5" fill="#fbd9b7"/>
    <rect x="-8" y="4" width="16" height="15" rx="7" fill="#eeba90"/>
    <!-- cabeça -->
    <g transform="translate(0,-14)">
      <ellipse cx="0" cy="0" rx="24" ry="26" fill="#fbd9b7"/>
      <ellipse cx="-8.5" cy="-1" rx="6.4" ry="7.4" fill="#ffffff"/>
      <ellipse cx="8.5" cy="-1" rx="6.4" ry="7.4" fill="#ffffff"/>
      <circle cx="-8" cy="0" r="4" fill="#4a3728"/>
      <circle cx="9" cy="0" r="4" fill="#4a3728"/>
      <circle cx="-9.5" cy="-1.8" r="1.5" fill="#ffffff"/>
      <circle cx="7.5" cy="-1.8" r="1.5" fill="#ffffff"/>
      <path d="M -13 -11 Q -8 -14 -4 -11.5" stroke="#4b3626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M 4 -11.5 Q 8 -14 13 -11" stroke="#4b3626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M -7 12 Q 0 18 7 12 Q 0 15 -7 12 Z" fill="#7d3f3a"/>
      <path d="M -24 -4 C -27 -27 -10 -34 0 -34 C 13 -34 27 -27 24 -4 C 19 -18 10 -21 0 -20 C -11 -19 -19 -14 -24 -4 Z" fill="#3b2a1f"/>
    </g>
  </g>

  <!-- ============ BANCO COM PASSAGEIRO PULANDO ============ -->
  <g>
    <ellipse cx="676" cy="470" rx="110" ry="13" fill="#5f748a" opacity="0.2" filter="url(#shE)"/>
    <rect x="590" y="396" width="176" height="15" rx="7" fill="#c79a63"/>
    <rect x="590" y="372" width="176" height="13" rx="6" fill="#d8ab74"/>
    <rect x="602" y="411" width="13" height="50" rx="6" fill="#8d99a8"/>
    <rect x="742" y="411" width="13" height="50" rx="6" fill="#8d99a8"/>
    <rect x="590" y="346" width="15" height="52" rx="7" fill="#b98a55"/>
    <rect x="752" y="346" width="15" height="52" rx="7" fill="#b98a55"/>
  </g>
  <g transform="translate(676,268) scale(0.86)">
    <!-- pernas dobradas (pulando) -->
    <path d="M -8 96 Q -26 118 -18 136" stroke="#35506e" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 14 96 Q 32 116 26 134" stroke="#35506e" stroke-width="18" stroke-linecap="round" fill="none"/>
    <ellipse cx="-20" cy="142" rx="14" ry="8" fill="#ffffff" stroke="#d3dfeb" stroke-width="3"/>
    <ellipse cx="30" cy="140" rx="14" ry="8" fill="#ffffff" stroke="#d3dfeb" stroke-width="3"/>
    <!-- braços para cima -->
    <path d="M -26 54 Q -46 34 -50 12" stroke="#7ba2c9" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="-52" cy="8" r="8" fill="#fbd9b7"/>
    <path d="M 26 54 Q 46 34 50 12" stroke="#7ba2c9" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="52" cy="8" r="8" fill="#fbd9b7"/>
    <!-- corpo -->
    <path d="M -27 98 L -27 46 Q -27 28 -13 24 L 0 34 L 14 24 Q 27 28 27 46 L 27 98 Z" fill="#7ba2c9"/>
    <rect x="-8" y="15" width="16" height="15" rx="7" fill="#eeba90"/>
    <!-- cabeça -->
    <g transform="translate(0,-4)">
      <ellipse cx="0" cy="0" rx="24" ry="26" fill="#fbd9b7"/>
      <ellipse cx="-8.5" cy="-1" rx="6.4" ry="7.4" fill="#ffffff"/>
      <ellipse cx="8.5" cy="-1" rx="6.4" ry="7.4" fill="#ffffff"/>
      <circle cx="-8" cy="0" r="4" fill="#4a3728"/>
      <circle cx="9" cy="0" r="4" fill="#4a3728"/>
      <circle cx="-9.5" cy="-1.8" r="1.5" fill="#ffffff"/>
      <circle cx="7.5" cy="-1.8" r="1.5" fill="#ffffff"/>
      <path d="M -13 -11 Q -8 -14 -4 -11.5" stroke="#4b3626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M 4 -11.5 Q 8 -14 13 -11" stroke="#4b3626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M -7 11 Q 0 19 7 11 Q 0 14.5 -7 11 Z" fill="#7d3f3a"/>
      <path d="M -24 -4 C -27 -27 -10 -34 0 -34 C 13 -34 27 -27 24 -4 C 19 -18 10 -21 0 -20 C -11 -19 -19 -14 -24 -4 Z" fill="#4b3626"/>
    </g>
    <!-- marca de movimento -->
    <g stroke="#9db9d2" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <line x1="-40" y1="150" x2="-40" y2="166"/>
      <line x1="0" y1="156" x2="0" y2="172"/>
      <line x1="40" y1="150" x2="40" y2="166"/>
    </g>
  </g>

  <!-- lixeira -->
  <g transform="translate(66,392)">
    <rect x="0" y="0" width="46" height="64" rx="10" fill="#8fb6a5"/>
    <rect x="-4" y="-8" width="54" height="14" rx="7" fill="#6f9a8c"/>
    <rect x="14" y="14" width="18" height="5" rx="2.5" fill="#5c8478"/>
  </g>
</svg>
