  <rect y="42" width="800" height="12" fill="#5c86b1"/>
  <line x1="252" y1="48" x2="252" y2="66" stroke="#54789e" stroke-width="4"/>
  <line x1="548" y1="48" x2="548" y2="66" stroke="#54789e" stroke-width="4"/>
  <rect x="182" y="66" width="140" height="36" rx="10" fill="#2f6cb5"/>
  <text x="252" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Embarque</text>
  <rect x="478" y="66" width="140" height="36" rx="10" fill="#43b97f"/>
  <text x="548" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Saída →</text>

