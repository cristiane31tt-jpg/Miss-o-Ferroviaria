<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Cena de embarque: a família espera em fila atrás da faixa amarela enquanto passageiros desembarcam com segurança">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceefb"/>
      <stop offset="1" stop-color="#f6ebd7"/>
    </linearGradient>
    <linearGradient id="floorB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#ced8e2"/>
    </linearGradient>
    <linearGradient id="yelB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd70"/>
      <stop offset="1" stop-color="#efb72c"/>
    </linearGradient>
    <linearGradient id="trainB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce8f2"/>
    </linearGradient>
    <linearGradient id="skinDb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5a38"/>
      <stop offset="1" stop-color="#744526"/>
    </linearGradient>
    <linearGradient id="skinMb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c69c"/>
      <stop offset="1" stop-color="#e3b183"/>
    </linearGradient>
    <pattern id="tactB" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.6" fill="#ffe9a3" opacity="0.9"/>
      <circle cx="17" cy="17" r="3.6" fill="#ffe9a3" opacity="0.9"/>
    </pattern>
    <filter id="shB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgB)"/>
  <!-- cobertura -->
