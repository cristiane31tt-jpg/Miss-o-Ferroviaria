<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Cena de passagem de nível: a família espera atrás da cancela fechada, com luzes vermelhas acesas, enquanto o trem passa pela via">
  <defs>
    <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f7"/>
      <stop offset="1" stop-color="#eaf6f1"/>
    </linearGradient>
    <linearGradient id="trainN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce8f2"/>
    </linearGradient>
    <linearGradient id="yelN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd70"/>
      <stop offset="1" stop-color="#efb72c"/>
    </linearGradient>
    <radialGradient id="lampG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#ff8a80" stop-opacity="0"/>
    </radialGradient>
    <filter id="shN" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#skyN)"/>
